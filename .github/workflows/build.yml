name: Build container image

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'

  schedule:
    - cron: '05 10 * * *'

  workflow_dispatch:


env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"


concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true


jobs:

  build_push:

    name: Build and push image
    runs-on: ubuntu-24.04


    permissions:
      contents: read
      packages: write


    steps:


      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1


      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e


      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3


      - name: Check Just Syntax
        shell: bash
        run: |
          just check


      - name: Get Image Name
        shell: bash
        run: |
          echo "IMAGE_NAME=$(just image_name)" >> $GITHUB_ENV


      - name: Get Default Tag
        shell: bash
        run: |
          echo "DEFAULT_TAG=$(just generate-default-tag)" >> $GITHUB_ENV


      - name: Prepare Environment
        shell: bash
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> $GITHUB_ENV
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV


      - name: Build Image
        shell: bash
        run: |
          just build \
          ${IMAGE_NAME} \
          ${DEFAULT_TAG}


      - name: Rechunk with rpm-ostree
        shell: bash
        run: |
          just ostree-rechunk \
          ${IMAGE_NAME} \
          ${DEFAULT_TAG}


      - name: Generate Build Tags
        id: tags
        shell: bash
        run: |

          TAGS=$(just generate-build-tags \
          ${IMAGE_NAME} \
          ${DEFAULT_TAG})

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT


      - name: Tag Image
        shell: bash
        run: |

          just tag-images \
          "${IMAGE_NAME}" \
          "${DEFAULT_TAG}" \
          "${{ steps.tags.outputs.tags }}"


      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7

        with:

          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}



      - name: Push Image To GHCR
        if: github.event_name != 'pull_request'
        shell: bash

        run: |

          set -euxo pipefail


          for tag in ${{ steps.tags.outputs.tags }}

          do

            podman push \
            ${IMAGE_NAME}:${tag} \
            ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}

          done
